name: Test Setup

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets are configured
        env:
          DEVICE_ID: ${{secrets.DEVICE_ID}}
          MY_PHONE_NUMBER: ${{ secrets.MY_PHONE_NUMBER }}
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          TEXTBEE_API: ${{ secrets.TEXTBEE_API }}
          MY_LATITUDE: ${{ vars.MY_LATITUDE }}
          MY_LONGITUDE: ${{ vars.MY_LONGITUDE }}
        run: |
          if [ -z "$DEVICE_ID" ]; then
            echo "DEVICE_ID secret is not set!"
            echo "Go to Settings > Secrets > Actions and add it."
            exit 1
          else
            echo "DEVICE_ID is configured"
          fi

          if [ -z "$MY_PHONE_NUMBER" ]; then
            echo "MY_PHONE_NUMBER secret is not set!"
            echo "Go to Settings > Secrets > Actions and add it."
            exit 1
          else
            echo "MY_PHONE_NUMBER is configured"
          fi
          
          if [ -z "$OWM_API_KEY" ]; then
            echo "OWM_API_KEY secret is not set!"
            echo "Go to Settings > Secrets > Actions and add it."
            exit 1
          else
            echo "OWM_API_KEY is configured"
          fi
          
          if [ -z "$TEXTBEE_API" ]; then
            echo "TEXTBEE_API secret is not set!"
            echo "Go to Settings > Secrets > Actions and add it."
            exit 1
          else
            echo "TEXTBEE_API is configured"
          fi
          
          echo ""
          echo "All secrets are configured!"
          
          if [ -z "MY_LATITUDE" ]; then
            echo "MY_LATITUDE secret is not set!"
            echo "Go to Settings > Secrets > Actions and add it."
            exit 1
          else
            echo "MY_LATITUDE is configured"
          fi
          
          if [ -z "MY_LONGITUDE" ]; then
            echo "MY_LONGITUDE secret is not set!"
            echo "Go to Settings > Secrets > Actions and add it."
            exit 1
          else
            echo "MY_LONGITUDE is configured"
          fi

          echo ""
          echo "All variables are configured!"

      - name: Check required files exist
        run: |
          echo "Checking for required files..."

          if [ -f "main.py" ]; then
            echo "main.py found"
          else
            echo "main.py not found!"
            exit 1
          fi

          if [ -f "requirements.txt" ]; then
            echo "requirements.txt found"
          else
            echo "requirements.txt not found!"
            exit 1
          fi

          echo ""
          echo "All required files found!"

      - name: Test Python syntax
        run: python -m py_compile main.py && echo "Python syntax OK"

      - name: Success
        run: |
          echo ""
          echo "========================================"
          echo "  All checks passed!"
          echo "  Your setup is ready to go."
          echo "========================================"
